name: operations-v1
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract-and-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: demo
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:demo@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m contracts.export && git diff --exit-code contracts
      - name: Start Compose and create a synthetic incident over HTTP
        run: |
          python -m operations.dev keys
          docker compose up --build -d
          curl --retry 20 --retry-delay 1 --retry-all-errors -fsS http://127.0.0.1:8080/openapi.json > /tmp/live-api.json
          token=$(python -m operations.dev token)
          curl -fsS http://127.0.0.1:8080/v1/incidents \
            -H "Authorization: Bearer $token" -H 'Idempotency-Key: compose-smoke' \
            -H 'Content-Type: application/json' --data @contracts/v1/manual.example.json > /tmp/manual-incident.json
          python -c "import json; x=json.load(open('/tmp/manual-incident.json')); assert x['version']==1 and x['state']=='investigation' and x['tenant']=='demo'"
          docker compose ps --status running --services | sort > /tmp/live-services
          diff /tmp/live-services <(printf '%s\n' api postgres worker)
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
