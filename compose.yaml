x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://aire:local_only@postgres/aire
    AIRE_PUBLIC_KEY: /keys/public.pem
    AIRE_ISSUER: aire-local
    AIRE_CLIENTS: portal,mobile,postmortem,bot
  volumes:
    - ./.local/public.pem:/keys/public.pem:ro

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aire
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: aire
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aire"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: python -m operations.db
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *app
    command: python -m operations.worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  data:
